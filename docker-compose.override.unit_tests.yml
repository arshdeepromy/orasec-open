---
services:
  nginx: !reset
  uwsgi:
    build:
      target: django-unittests
    entrypoint: ['/wait-for-it.sh', '${ORASEC_DATABASE_HOST:-postgres}:${ORASEC_DATABASE_PORT:-5432}', '-t', '30', '--', '/app/docker/entrypoint-unit-tests-devDocker.sh']
    volumes:
      - '.:/app:z'
      - "orasec_media_unit_tests:${ORASEC_MEDIA_ROOT:-/app/media}"
    depends_on: !override
      postgres:
        condition: service_started
    environment:
      PYTHONWARNINGS: error  # We are strict about Warnings during testing
      ORASEC_DEBUG: 'True'
      ORASEC_TEST_DATABASE_NAME: ${ORASEC_TEST_DATABASE_NAME:-test_orasec}
      ORASEC_DATABASE_NAME: ${ORASEC_TEST_DATABASE_NAME:-test_orasec}
      ORASEC_DATABASE_ENGINE: ${ORASEC_DATABASE_ENGINE:-django.db.backends.postgresql}
      ORASEC_DATABASE_HOST: ${ORASEC_DATABASE_HOST:-postgres}
      ORASEC_DATABASE_PORT: ${ORASEC_DATABASE_PORT:-5432}
      ORASEC_DATABASE_USER: ${ORASEC_DATABASE_USER:-orasec}
      ORASEC_DATABASE_PASSWORD: ${ORASEC_DATABASE_PASSWORD:-orasec}
      # In-memory broker, the same as docker-compose.override.unit_tests_cicd.yml. The
      # sqla+sqlite transport goes through kombu's SQLAlchemy models, and under
      # PYTHONWARNINGS=error SQLAlchemy 2.1's deprecation of the `noload` loader they
      # use fails the first task dispatch in any test. settings.dist.py only builds
      # the URL from the scheme and path when ORASEC_CELERY_BROKER_URL is empty, and these
      # two produce exactly "memory://".
      ORASEC_CELERY_BROKER_URL: ''
      ORASEC_CELERY_BROKER_SCHEME: 'memory'
      ORASEC_CELERY_BROKER_PATH: ''
      # No Redis/valkey in unit tests -> default django cache is LocMemCache.
      ORASEC_CACHE_URL: ''
      # Product grading is debounced through a cache marker with a wall-clock window
      # (orasec.utils.schedule_product_grade). Under the test runner a dispatched grade task
      # may never run, so a marker would outlive its test and silently skip grading for the
      # next test whose product gets the same id, and it makes query counts depend on
      # timing. 0 queues a task per change, as before; the debounce's own unit tests turn
      # the window on explicitly.
      ORASEC_PRODUCT_GRADE_DEBOUNCE_SECONDS: '0'
      # In-process singleton cache (orasec/caching.py) stays ON for deterministic
      # assertNumQueries counts; reset per request (middleware) and per test.
      ORASEC_SETTINGS_CACHE_L1_TTL: '30'
      ORASEC_JIRA_EXTRA_ISSUE_TYPES: 'Vulnerability' # Shouldn't trigger a migration error
  celerybeat: !reset
  celeryworker: !reset
  initializer: !reset
  postgres:
    ports:
      - target: ${ORASEC_DATABASE_PORT:-5432}
        published: ${ORASEC_DATABASE_PORT:-5432}
        protocol: tcp
        mode: host
    environment:
      POSTGRES_DB: ${ORASEC_TEST_DATABASE_NAME:-test_orasec}
    volumes:
      - orasec_postgres_unit_tests:/var/lib/postgresql/data
  valkey: !reset
  "webhook.endpoint":
    image: mccutchen/go-httpbin:2.18.3@sha256:3992f3763e9ce5a4307eae0a869a78b4df3931dc8feba74ab823dd2444af6a6b
volumes:
  orasec_postgres_unit_tests: {}
  orasec_media_unit_tests: {}
