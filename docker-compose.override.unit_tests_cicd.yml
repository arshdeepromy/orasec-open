---
services:
  nginx: !reset
  uwsgi:
    build:
      target: django-unittests
    entrypoint: ['/wait-for-it.sh', '${ORASEC_DATABASE_HOST:-postgres}:${ORASEC_DATABASE_PORT:-5432}', '-t', '30', '--', '/app/docker/entrypoint-unit-tests.sh']
    volumes:
      - '.:/app:z'
      - "orasec_media_unit_tests:${ORASEC_MEDIA_ROOT:-/app/media}"
    depends_on: !override
      postgres:
        condition: service_started
    environment:
      PYTHONWARNINGS: error  # We are strict about Warnings during testing
      ORASEC_DEBUG: 'False'
      ORASEC_LOG_LEVEL: 'ERROR'
      ORASEC_TEST_DATABASE_NAME: ${ORASEC_TEST_DATABASE_NAME:-test_orasec}
      ORASEC_DATABASE_NAME: ${ORASEC_TEST_DATABASE_NAME:-test_orasec}
      ORASEC_DATABASE_ENGINE: ${ORASEC_DATABASE_ENGINE:-django.db.backends.postgresql}
      ORASEC_DATABASE_HOST: ${ORASEC_DATABASE_HOST:-postgres}
      ORASEC_DATABASE_PORT: ${ORASEC_DATABASE_PORT:-5432}
      # An in-process broker rather than the default sqlite file. Nothing consumes
      # the queue in unit tests -- celeryworker and celerybeat are both reset
      # above -- so a real broker contributes nothing but contention: under
      # --parallel every worker process opens the same sqlite file and they race
      # to declare the queue, which fails in whichever loses with
      # "UNIQUE constraint failed: kombu_queue.name".
      #
      # Set through the scheme, because settings.dist.py only assembles a URL from
      # the parts when ORASEC_CELERY_BROKER_URL is empty. double_slashes=True there
      # turns these two into exactly "memory://". The entrypoint also unsets
      # ORASEC_CELERY_BROKER_URL, but blanking it here means the broker does not
      # depend on that happening -- and it stops the base compose file's
      # redis://valkey URL, which no unit test has a valkey for, showing through.
      ORASEC_CELERY_BROKER_URL: ''
      ORASEC_CELERY_BROKER_SCHEME: 'memory'
      ORASEC_CELERY_BROKER_PATH: ''
      ORASEC_JIRA_EXTRA_ISSUE_TYPES: 'Vulnerability' # Shouldn't trigger a migration error
      ORASEC_V3_FEATURE_LOCATIONS: ${ORASEC_V3_FEATURE_LOCATIONS:-False}
      # full | prepare | reuse -- see docker/entrypoint-unit-tests.sh. CI sets
      # this to replace the migrate with restoring a snapshot of its result.
      ORASEC_TEST_DB_MODE: ${ORASEC_TEST_DB_MODE:-full}
      # No Redis/valkey in unit tests -> default django cache is LocMemCache.
      ORASEC_CACHE_URL: ''
      # Product grading is debounced through a cache marker with a wall-clock window
      # (orasec.utils.schedule_product_grade). Under the test runner a dispatched grade task
      # may never run, so a marker would outlive its test and silently skip grading for the
      # next test whose product gets the same id, and it makes query counts depend on
      # timing. 0 queues a task per change, as before; the debounce's own unit tests turn
      # the window on explicitly.
      ORASEC_PRODUCT_GRADE_DEBOUNCE_SECONDS: '0'
      # In-process singleton cache (orasec/caching.py) stays ON: a singleton is read
      # once per request/test (deterministic assertNumQueries), reset per request
      # (middleware) and per test (orasec_test_case setUp).
      ORASEC_SETTINGS_CACHE_L1_TTL: '30'
  celerybeat: !reset
  celeryworker: !reset
  initializer: !reset
  postgres:
    ports:
      - target: ${ORASEC_DATABASE_PORT:-5432}
        published: ${ORASEC_DATABASE_PORT:-5432}
        protocol: tcp
        mode: host
    environment:
      POSTGRES_DB: ${ORASEC_TEST_DATABASE_NAME:-test_orasec}
    volumes:
      - orasec_postgres_unit_tests:/var/lib/postgresql/data
  valkey: !reset
  "webhook.endpoint":
    image: mccutchen/go-httpbin:2.18.3@sha256:3992f3763e9ce5a4307eae0a869a78b4df3931dc8feba74ab823dd2444af6a6b
volumes:
  orasec_postgres_unit_tests: {}
  orasec_media_unit_tests: {}
