---
services:
  nginx:
    environment:
      USE_TLS: 'true'
      GENERATE_TLS_CERTIFICATE: 'true'
    ports:
      - target: 8443
        published: ${ORASEC_TLS_PORT:-8443}
        protocol: tcp
        mode: host
  uwsgi:
    environment:
      ORASEC_SESSION_COOKIE_SECURE: 'True'
      ORASEC_CSRF_COOKIE_SECURE: 'True'
